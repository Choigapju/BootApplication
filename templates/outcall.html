<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아웃콜 관리 시스템</title>
    <!-- Pretendard 폰트 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --main-orange: #FF7710;
            --main-bg: #FFFAF5;
            --main-dark: #3F3F3F;
            --main-white: #fff;
            --main-shadow: 0 2px 8px rgba(63,63,63,0.06);
        }
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
            color: var(--main-dark);
            margin: 0;
            padding: 0;
        }
        .main-header {
            width: 100vw;
            background: #FF7710;
            color: #fff;
            font-size: 2rem;
            font-weight: 900;
            padding: 24px 0 18px 32px;
            letter-spacing: -1px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            margin-right: 32px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        .section {
            background: var(--main-white);
            border-radius: 18px;
            box-shadow: var(--main-shadow);
            margin: 32px 0;
            padding: 32px 3vw;
            max-width: 100vw;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            font-weight: 800;
            margin-top: 0;
            color: var(--main-dark);
            margin-bottom: 24px;
        }
        .table-wrap {
            width: 100vw;
            max-width: 100vw;
            overflow-x: scroll; /* 강제로 스크롤바 표시 */
            overflow-y: hidden; /* 세로 스크롤은 숨김 */
            margin: 0 -3vw;
            /* 윈도우 PC에서도 편리한 스크롤바 */
            scrollbar-width: auto; /* thin에서 auto로 변경 */
            scrollbar-color: #FF7710 #e9ecef;
            /* 스크롤 위치 조정을 위한 패딩 */
            padding-bottom: 25px;
            /* 스크롤바 강제 표시를 위한 설정 */
            scrollbar-gutter: stable;
        }
        
        /* 웹킷 기반 브라우저 (Chrome, Safari, Edge) 스크롤바 스타일 */
        .table-wrap::-webkit-scrollbar {
            height: 18px !important; /* 강제로 크게 설정 */
            -webkit-appearance: none;
        }
        
        .table-wrap::-webkit-scrollbar-track {
            background: #e9ecef !important;
            border-radius: 9px;
            margin: 0 15px;
            border: 2px solid #dee2e6;
            -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
        }
        
        .table-wrap::-webkit-scrollbar-thumb {
            background: #FF7710 !important;
            border-radius: 9px;
            border: 3px solid #e9ecef;
            box-shadow: 0 2px 6px rgba(255, 119, 16, 0.5);
            min-width: 40px !important; /* 최소 너비 강화 */
            -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
        }
        
        .table-wrap::-webkit-scrollbar-thumb:hover {
            background: #e65c00 !important;
            box-shadow: 0 2px 10px rgba(255, 119, 16, 0.7);
        }
        
        .table-wrap::-webkit-scrollbar-corner {
            background: #e9ecef;
        }
        
        /* 테이블이 스크롤 가능하도록 최소 너비 보장 */
        .table-wrap table {
            min-width: calc(100vw + 200px) !important; /* 항상 스크롤이 필요하도록 */
        }
        table {
            width: 100%;
            min-width: 1800px;
            background: var(--main-white);
            margin-bottom: 16px;
            table-layout: auto;
        }
        th, td {
            padding: 10px 8px;
            text-align: center;
            white-space: nowrap;
        }
        th {
            background: var(--main-bg);
            color: var(--main-dark);
            font-weight: 700;
            border-bottom: 2px solid var(--main-orange);
            padding: 12px 8px;
        }
        tr {
            transition: background 0.15s;
        }
        tr:hover {
            background: #FFF3E5;
        }
        .upload-btn {
            background: #FF7710;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(255,119,16,0.08);
            transition: background 0.2s;
            text-decoration: none;
        }
        .upload-btn:hover {
            background: #e65c00;
        }
        .save-btn {
            background: var(--main-orange);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(255,119,16,0.08);
            min-width: 60px;
            white-space: nowrap;
        }
        .save-btn:hover {
            background: #e65c00;
        }
        .no-data {
            text-align: center;
            color: #aaa;
            padding: 24px 0;
        }
        .table-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .table-toolbar select, .table-toolbar input[type="text"] {
            border: 1.5px solid #FF7710;
            border-radius: 8px;
            padding: 8px 12px;
            background: #FFFAF5;
            color: #3F3F3F;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="main-header">
        <a href="#" id="homeTitle" style="color:inherit;text-decoration:none;cursor:pointer;">
            <span>아웃콜 관리 시스템</span>
        </a>
        <div class="nav-links">
            <a href="/">📊 메인 대시보드</a>
            <a href="/trends">📈 지원 추이 분석</a>
        </div>
    </div>

    <div class="section">
        <h2>아웃콜 지원자 관리</h2>
        <div class="table-toolbar">
            <div style="display:flex; align-items:center; gap:10px; flex:1;">
                <select id="bootcampSelect" style="min-width:180px;"></select>
                <input type="text" id="searchInput" placeholder="이름 또는 전화번호 검색..." style="flex:0 0 200px;">
            </div>
            <button type="button" id="downloadBtn" class="upload-btn" style="background:#fff; color:#FF7710; border:1.5px solid #FF7710; margin-right:8px;">
                ⬇️ 아웃콜 데이터 다운로드
            </button>
            <form class="upload-form" id="uploadForm" enctype="multipart/form-data" style="margin:0;">
                <label for="fileInput" class="upload-btn" style="cursor:pointer;">
                    <span style="font-size:1.6em;">⬆️</span>
                    아웃콜 데이터 업로드
                </label>
                <input type="file" id="fileInput" name="file" style="display:none;" required />
            </form>
        </div>
        <div id="uploadMessage" style="margin-bottom:10px;"></div>
        
        <div class="scroll-hint" style="text-align: center; margin-bottom: 10px; color: #666; font-size: 0.85rem; font-weight: bold;">
            💡 Shift + 마우스휠로 좌우 스크롤 가능
        </div>
        <div class="table-wrap">
            <table id="outcallTable">
                <thead>
                    <tr>
                        <!-- 1. 기본 정보 -->
                        <th colspan="9" style="background:#FFE066; color:#333; text-align:center; font-weight:800;">1. 기본 정보</th>
                        <!-- 2. 현황 -->
                        <th colspan="3" style="background:#A8FFB6; color:#333; text-align:center; font-weight:800;">2. 현황</th>
                        <!-- 3. 콜 현황 -->
                        <th colspan="3" style="background:#6EC6FF; color:#333; text-align:center; font-weight:800;">3. 콜 현황</th>
                        <!-- 4. 이탈 관리 -->
                        <th colspan="5" style="background:#FFB6C1; color:#333; text-align:center; font-weight:800;">4. 이탈 관리 (고민 중)</th>
                        <th rowspan="2">
                          <button id="saveAllBtn" class="save-btn" style="margin-left:8px;">전체 저장</button>
                        </th>
                    </tr>
                    <tr>
                        <!-- 1. 기본 정보 -->
                        <th>이름</th>
                        <th>번호</th>
                        <th>멋사 가입 이메일</th>
                        <th>지원서 이메일</th>
                        <th>성별</th>
                        <th>생년월일</th>
                        <th>나이</th>
                        <th>유입 경로</th>
                        <th>지원 완료일</th>
                        <!-- 2. 현황 -->
                        <th>합격</th>
                        <th>HRD전환</th>
                        <th>내일배움카드</th>
                        <!-- 3. 콜 현황 -->
                        <th>콜 필요</th>
                        <th>최종 콜</th>
                        <th>콜 결과</th>
                        <!-- 4. 이탈 관리 -->
                        <th>고민 여부</th>
                        <th>고민 이유</th>
                        <th>최종 콜</th>
                        <th>콜 성과</th>
                        <th>추가 콜 필요</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // 아웃콜 지원자 목록 조회 (페이지네이션 포함)
        async function fetchOutcallStudents(page = 1) {
            const bootcamp = window.selectedBootcamp || '';
            const generation = window.selectedGeneration || '';
            const search = document.getElementById('searchInput')?.value?.trim() || '';
            let url = `/outcall/students?bootcamp=${encodeURIComponent(bootcamp)}&generation=${encodeURIComponent(generation)}&page=${page}&per_page=30`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            
            const res = await fetch(url);
            let response = {};
            try {
                response = await res.json();
                if (!response.students) response = { students: [], pagination: {} };
            } catch (e) {
                response = { students: [], pagination: {} };
            }
            const data = response.students || [];
            const pagination = response.pagination || {};
            
            const tbody = document.querySelector('#outcallTable tbody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="21" class="no-data">아웃콜 지원자 데이터가 없습니다</td></tr>`;
            } else {
                data.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <!-- 1. 기본 정보 -->
                        <td>${s.name || ''}</td>
                        <td>${s.phone || ''}</td>
                        <td>${s.signup_email || ''}</td>
                        <td>${s.application_email || ''}</td>
                        <td>${s.gender || ''}</td>
                        <td>
                            <input type="date" class="birth-date-input" data-id="${s.id}" value="${s.birth_date || ''}" style="width:120px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                        </td>
                        <td>${s.age || ''}</td>
                        <td>
                            <select class="source-select" data-id="${s.id}" style="width:100px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">선택</option>
                                <option value="광고" ${(s.source || '').trim() === '광고' ? 'selected' : ''}>광고</option>
                                <option value="지인 추천" ${(s.source || '').trim() === '지인 추천' ? 'selected' : ''}>지인 추천</option>
                                <option value="검색" ${(s.source || '').trim() === '검색' ? 'selected' : ''}>검색</option>
                                <option value="SNS" ${(s.source || '').trim() === 'SNS' ? 'selected' : ''}>SNS</option>
                                <option value="기타" ${(s.source || '').trim() === '기타' ? 'selected' : ''}>기타</option>
                            </select>
                        </td>
                        <td>${s.application_completion_date || ''}</td>
                        
                        <!-- 2. 현황 -->
                        <td>
                            <select class="pass-status-select" data-id="${s.id}" style="width:80px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="●" ${(s.pass_status || '').trim() === '●' ? 'selected' : ''}>●</option>
                                <option value="X" ${(s.pass_status || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        <td>
                            <select class="hrd-conversion-select" data-id="${s.id}" style="width:80px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="●" ${(s.hrd_conversion || '').trim() === '●' ? 'selected' : ''}>●</option>
                                <option value="X" ${(s.hrd_conversion || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        <td>
                            <select class="learning-card-select" data-id="${s.id}" style="width:80px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="●" ${(s.learning_card || '').trim() === '●' ? 'selected' : ''}>●</option>
                                <option value="X" ${(s.learning_card || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        
                        <!-- 3. 콜 현황 -->
                        <td>
                            <select class="call-required-select" data-id="${s.id}" style="width:60px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="O" ${(s.call_required || '').trim() === 'O' ? 'selected' : ''}>O</option>
                                <option value="X" ${(s.call_required || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        <td>
                            <input type="date" class="last-call-date-input" data-id="${s.id}" value="${s.last_call_date || ''}" style="width:110px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                        </td>
                        <td>
                            <select class="call-result-select" data-id="${s.id}" style="width:80px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="●" ${(s.call_result || '').trim() === '●' ? 'selected' : ''}>●</option>
                                <option value="X" ${(s.call_result || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        
                        <!-- 4. 이탈 관리 -->
                        <td>
                            <select class="considering-select" data-id="${s.id}" style="width:60px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">-</option>
                                <option value="O" ${(s.is_considering || '').trim() === 'O' ? 'selected' : ''}>O</option>
                                <option value="X" ${(s.is_considering || '').trim() === 'X' ? 'selected' : ''}>X</option>
                            </select>
                        </td>
                        <td>
                            <select class="reason-select" data-id="${s.id}" style="width:100px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">선택</option>
                                <option value="전화 안됨" ${(s.considering_reason || '').trim() === '전화 안됨' ? 'selected' : ''}>전화 안됨</option>
                                <option value="타 기관과 고민중" ${(s.considering_reason || '').trim() === '타 기관과 고민중' ? 'selected' : ''}>타 기관과 고민중</option>
                                <option value="일정 고민중" ${(s.considering_reason || '').trim() === '일정 고민중' ? 'selected' : ''}>일정 고민중</option>
                                <option value="비용 고민중" ${(s.considering_reason || '').trim() === '비용 고민중' ? 'selected' : ''}>비용 고민중</option>
                                <option value="건강" ${(s.considering_reason || '').trim() === '건강' ? 'selected' : ''}>건강</option>
                                <option value="기타" ${(s.considering_reason || '').trim() === '기타' ? 'selected' : ''}>기타</option>
                            </select>
                        </td>
                        <td>
                            <input type="date" class="final-call-date-input" data-id="${s.id}" value="${s.final_call_date || ''}" style="width:110px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                        </td>
                        <td>
                            <select class="call-outcome-select" data-id="${s.id}" style="width:100px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                                <option value="">선택</option>
                                <option value="설득 완료" ${(s.call_outcome || '').trim() === '설득 완료' ? 'selected' : ''}>설득 완료</option>
                                <option value="설득 중" ${(s.call_outcome || '').trim() === '설득 중' ? 'selected' : ''}>설득 중</option>
                                <option value="포기" ${(s.call_outcome || '').trim() === '포기' ? 'selected' : ''}>포기</option>
                            </select>
                        </td>
                        <td>
                            <input type="date" class="additional-call-input" data-id="${s.id}" value="${s.additional_call_needed || ''}" style="width:110px; border:1px solid #FF7710; border-radius:4px; padding:4px;">
                        </td>
                        
                        <td>
                            <button class="save-btn" data-id="${s.id}">저장</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // 저장 버튼 이벤트 등록
                document.querySelectorAll('.save-btn').forEach(btn => {
                    btn.onclick = async function() {
                        const id = btn.getAttribute('data-id');
                        const row = btn.closest('tr');
                        
                        const updateData = {
                            id: id,
                            birth_date: row.querySelector('.birth-date-input')?.value || '',
                            source: row.querySelector('.source-select')?.value || '',
                            pass_status: row.querySelector('.pass-status-select')?.value || '',
                            hrd_conversion: row.querySelector('.hrd-conversion-select')?.value || '',
                            learning_card: row.querySelector('.learning-card-select')?.value || '',
                            call_required: row.querySelector('.call-required-select')?.value || '',
                            last_call_date: row.querySelector('.last-call-date-input')?.value || '',
                            call_result: row.querySelector('.call-result-select')?.value || '',
                            is_considering: row.querySelector('.considering-select')?.value || '',
                            considering_reason: row.querySelector('.reason-select')?.value || '',
                            final_call_date: row.querySelector('.final-call-date-input')?.value || '',
                            call_outcome: row.querySelector('.call-outcome-select')?.value || '',
                            additional_call_needed: row.querySelector('.additional-call-input')?.value || ''
                        };
                        
                        try {
                            const res = await fetch('/outcall/update', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify(updateData)
                            });
                            const data = await res.json();
                            if (res.ok) {
                                alert('성공적으로 저장되었습니다.');
                                fetchOutcallStudents(1);
                            } else {
                                alert(data.error || '저장 중 에러가 발생했습니다.');
                            }
                        } catch (error) {
                            alert('저장 중 에러가 발생했습니다.');
                        }
                    };
                });
            }
            
            // 페이지네이션 UI 렌더링
            renderOutcallPagination(pagination, page);
        }
        
        // 아웃콜 페이지네이션 UI 렌더링 함수
        function renderOutcallPagination(pagination, currentPage) {
            let paginationContainer = document.getElementById('outcallPaginationContainer');
            if (!paginationContainer) {
                paginationContainer = document.createElement('div');
                paginationContainer.id = 'outcallPaginationContainer';
                paginationContainer.style.cssText = 'text-align: center; margin: 20px 0; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(63,63,63,0.06);';
                // 테이블 아래에 배치
                const tableWrap = document.querySelector('.table-wrap');
                tableWrap.parentNode.appendChild(paginationContainer);
            }
            
            if (!pagination.total_pages || pagination.total_pages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            
            let paginationHTML = '<div style="display: inline-flex; gap: 8px; align-items: center;">';
            
            // 이전 페이지 버튼
            if (pagination.has_prev) {
                paginationHTML += `<button onclick="fetchOutcallStudents(${currentPage - 1})" style="padding: 8px 12px; border: 1px solid #FF7710; background: white; color: #FF7710; border-radius: 6px; cursor: pointer;">이전</button>`;
            }
            
            // 페이지 번호들
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(pagination.total_pages, currentPage + 2);
            
            if (startPage > 1) {
                paginationHTML += `<button onclick="fetchOutcallStudents(1)" style="padding: 8px 12px; border: 1px solid #ddd; background: white; color: #666; border-radius: 6px; cursor: pointer;">1</button>`;
                if (startPage > 2) {
                    paginationHTML += '<span style="padding: 8px;">...</span>';
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === currentPage;
                const style = isActive 
                    ? 'padding: 8px 12px; border: 1px solid #FF7710; background: #FF7710; color: white; border-radius: 6px; cursor: pointer;'
                    : 'padding: 8px 12px; border: 1px solid #ddd; background: white; color: #666; border-radius: 6px; cursor: pointer;';
                paginationHTML += `<button onclick="fetchOutcallStudents(${i})" style="${style}">${i}</button>`;
            }
            
            if (endPage < pagination.total_pages) {
                if (endPage < pagination.total_pages - 1) {
                    paginationHTML += '<span style="padding: 8px;">...</span>';
                }
                paginationHTML += `<button onclick="fetchOutcallStudents(${pagination.total_pages})" style="padding: 8px 12px; border: 1px solid #ddd; background: white; color: #666; border-radius: 6px; cursor: pointer;">${pagination.total_pages}</button>`;
            }
            
            // 다음 페이지 버튼
            if (pagination.has_next) {
                paginationHTML += `<button onclick="fetchOutcallStudents(${currentPage + 1})" style="padding: 8px 12px; border: 1px solid #FF7710; background: white; color: #FF7710; border-radius: 6px; cursor: pointer;">다음</button>`;
            }
            
            paginationHTML += '</div>';
            
            // 페이지 정보 표시
            paginationHTML += `<div style="margin-top: 12px; color: #666; font-size: 0.9rem;">
                ${pagination.total_count}명 중 ${((currentPage - 1) * pagination.per_page) + 1}-${Math.min(currentPage * pagination.per_page, pagination.total_count)}명 표시
            </div>`;
            
            paginationContainer.innerHTML = paginationHTML;
        }

        // 부트캠프 목록을 select로 렌더링
        async function renderBootcampSelect() {
            const res = await fetch('/bootcamps');
            const data = await res.json();
            const select = document.getElementById('bootcampSelect');
            select.innerHTML = '<option value="">전체 부트캠프</option>';
            
            const unique = Array.from(new Set(data.map(b => b.name + '||' + b.generation)))
                .map(str => {
                    const [name, generation] = str.split('||');
                    return {name, generation};
                });
            unique.forEach(b => {
                const label = b.name + (b.generation ? ' / ' + b.generation : '');
                const value = b.name + '||' + b.generation;
                const opt = document.createElement('option');
                opt.value = value;
                opt.innerText = label;
                select.appendChild(opt);
            });
            
            select.onchange = function() {
                const val = select.value;
                if (!val) {
                    window.selectedBootcamp = '';
                    window.selectedGeneration = '';
                } else {
                    const [name, generation] = val.split('||');
                    window.selectedBootcamp = name;
                    window.selectedGeneration = generation;
                }
                fetchOutcallStudents(1);
            };
        }

        // 페이지 로딩 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            renderBootcampSelect();
            fetchOutcallStudents(1);
        });

        document.getElementById('searchInput').addEventListener('input', () => fetchOutcallStudents(1));
        
        // 마우스 휠로 좌우 스크롤 지원 (윈도우 PC 사용성 개선)
        document.querySelector('.table-wrap').addEventListener('wheel', function(e) {
            // Shift + 휠 또는 가로 스크롤이 가능한 경우
            if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                e.preventDefault();
                this.scrollLeft += e.deltaY || e.deltaX;
            }
        }, { passive: false });
    </script>
</body>
</html>
